<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Intelligence Platform</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ADVANCED RAG</div>
        <h1>Engineering Intelligence Platform</h1>
        <p>Engineering change impact analysis and product failure investigation.</p>
      </div>
      <div class="status" id="status">Checking API…</div>
    </header>

    <section class="controls">
      <div class="control">
        <label for="productFamily">Product family</label>
        <select id="productFamily"></select>
      </div>

      <div class="control">
        <label for="searchScope">Search scope</label>
        <select id="searchScope">
          <option value="selected">Selected product family</option>
          <option value="all">All product families</option>
        </select>
      </div>

      <button id="clearBtn" class="secondary">Clear conversation</button>
    </section>

    <main class="main-grid">
      <section class="chat-panel">
        <div id="chat" class="chat"></div>

        <form id="chatForm" class="composer">
          <textarea
            id="question"
            rows="3"
            placeholder="Ask an engineering question..."
            required
          ></textarea>
          <button id="sendBtn" type="submit">Ask</button>
        </form>
      </section>

      <aside class="side-panel">
        <h2>Retrieved evidence</h2>
        <div id="intentBox" class="intent-box">Intent: —</div>
        <div id="queryBox" class="query-box">Standalone query: —</div>
        <div id="sources" class="sources"></div>
      </aside>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
